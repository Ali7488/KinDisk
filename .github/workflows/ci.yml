name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn 4 through Corepack
        run: |
          npm install --global corepack
          corepack enable

      # Temporary: prior commits added dependencies without updating yarn.lock.
      # Regenerate and commit yarn.lock locally, then switch to yarn install --immutable.
      - name: Install workspace dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

      # One-time lockfile capture; removed after the resolved lockfile is committed.
      - name: Capture resolved lockfile
        run: |
          echo '### LOCKFILE BEGIN ###'
          cat yarn.lock
          echo '### LOCKFILE END ###'

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

      - name: Frontend and backend tests
        run: yarn test

      - name: Production frontend build
        run: yarn build
